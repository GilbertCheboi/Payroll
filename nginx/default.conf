upstream backend_upstream {
    zone backend_upstream 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Django API ---
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme set by the upstream proxy (Nginx Proxy Manager),
        # fall back to this container's own scheme only if nothing was set yet.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /admin/ {
        proxy_pass http://backend_upstream/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Django static/media (if collectstatic output is mounted into this container)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        access_log off;
    }

    # --- React static build ---
    location = /index.html {
        root /usr/share/nginx/html;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
